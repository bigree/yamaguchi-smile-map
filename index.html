cross:'<polygon points="7,2 13,2 13,7 18,7 18,13 13,13 13,18 7,18 7,13 2,13 2,7 7,7"/>',star:'<polygon points="10,1.5 12.6,7.3 18.8,7.8 14.1,11.9 15.5,18 10,14.8 4.5,18 5.9,11.9 1.2,7.8 7.4,7.3"/>',
triangle:'<polygon points="10,2 18.5,17 1.5,17"/>',"tri-down":'<polygon points="10,18 18.5,3 1.5,3"/>',hexagon:'<polygon points="5.5,2.5 14.5,2.5 19,10 14.5,17.5 5.5,17.5 1,10"/>',
pentagon:'<polygon points="10,1.5 18.5,7.8 15.3,17.8 4.7,17.8 1.5,7.8"/>',ring:'<circle cx="10" cy="10" r="6" fill="#fff"/>'};
function svg(g,sz){const[,c,s]=GM[g];const ring=s==="ring";
 return `<svg width="${sz}" height="${sz}" viewBox="0 0 20 20" fill="${c}" stroke="${ring?c:'#fff'}" stroke-width="${ring?3:1.6}" stroke-linejoin="round">${SH[s]}</svg>`}
const map=L.map("map",{maxZoom:19}).setView([34.17,131.47],11);
fetch("https://tiles.openfreemap.org/styles/positron").then(r=>r.json()).then(st=>{st.layers=st.layers.filter(l=>l.type!=="symbol");
 L.maplibreGL({style:st,attribution:"&copy; OpenStreetMap contributors / OpenFreeMap / ジオコーダ: 国土地理院"}).addTo(map).getContainer().style.zIndex=0;});
const on=new Set(G.map(g=>g[0]));
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let FV=new Set();try{FV=new Set(JSON.parse(localStorage.getItem("smileFav")||"[]"))}catch(e){}
const key=s=>s.n+"|"+s.a;let favOnly=false;
function saveFV(){try{localStorage.setItem("smileFav",JSON.stringify([...FV]))}catch(e){}}
const MO=matchMedia("(max-width:700px)").matches;
const icon=s=>{const f=FV.has(key(s)),z=(MO?24:18)+(f?4:0);return L.divIcon({className:"mk"+(f?" fv":""),html:svg(s.g,z),iconSize:[z,z],iconAnchor:[z/2,z/2]})};
function popup(s,i){const d=document.createElement("div");
 d.innerHTML=`<b>${esc(s.n)}</b><br>${esc(s.a)}<br><small>${s.g} / ${s.d}地区</small><br><a target=_blank href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("山口県山口市"+s.a+" "+s.n)}">Googleマップで開く</a><br>`;
 const b=document.createElement("button");b.className="pb";const u=()=>b.textContent=FV.has(key(s))?"★ お気に入り解除":"☆ お気に入りに追加";u();
 b.onclick=()=>{toggleFav(i);u()};d.appendChild(b);return d}
function toggleFav(i){const k=key(S[i]);FV.has(k)?FV.delete(k):FV.add(k);saveFV();mk[i].setIcon(icon(S[i]));render()}
const mk=S.map((s,i)=>L.marker([s.lat,s.lon],{icon:icon(s)}).bindPopup(()=>popup(s,i)));
const lg=L.layerGroup().addTo(map);
function render(){const q=document.getElementById("q").value.trim().toLowerCase();lg.clearLayers();let n=0;
 S.forEach((s,i)=>{if(on.has(s.g)&&(!favOnly||FV.has(key(s)))&&(!q||(s.n+s.a).toLowerCase().includes(q))){lg.addLayer(mk[i]);n++}});
 document.getElementById("fn").textContent=FV.size;document.getElementById("lh").textContent=(document.body.classList.contains("lo")?"▼ リストを閉じる":"▲ 店舗リスト")+"（"+n+"件）";document.getElementById("c").textContent=n+" / "+S.length+" 店";renderList(q);}
function renderList(q){const L_=document.getElementById("l");const open=new Set([...L_.querySelectorAll("details[open]")].map(d=>d.dataset.g));const first=!L_.children.length;L_.innerHTML="";let any=false;
 G.forEach(([g])=>{if(!on.has(g))return;const ix=S.map((s,i)=>i).filter(i=>S[i].g==g&&(!favOnly||FV.has(key(S[i])))&&(!q||(S[i].n+S[i].a).toLowerCase().includes(q))).sort((a,b)=>S[a].n.localeCompare(S[b].n,"ja"));
  if(!ix.length)return;any=true;const d=document.createElement("details");d.dataset.g=g;if(open.has(g)||q)d.open=true;
  d.innerHTML=`<summary>${svg(g,16)}${g}(${ix.length})</summary>`;
  ix.forEach(i=>{const e=document.createElement("div");e.className="it";e.innerHTML=`<span class="st${FV.has(key(S[i]))?" on":""}" title="お気に入り">${FV.has(key(S[i]))?"★":"☆"}</span>${esc(S[i].n)}<small>${esc(S[i].a)}</small>`;
   e.querySelector(".st").onclick=ev=>{ev.stopPropagation();toggleFav(i)};
   e.onclick=()=>{if(MO){document.body.classList.remove("lo");render()}map.flyTo([S[i].lat,S[i].lon],18,{duration:.8});map.once("moveend",()=>mk[i].openPopup());};d.appendChild(e)});
  L_.appendChild(d)});
 if(!any)L_.innerHTML='<div class="em">表示するジャンルがありません</div>';}
const f=document.getElementById("f");
G.forEach(([g])=>{const c=S.filter(s=>s.g==g).length;const l=document.createElement("label");
 l.innerHTML=`<input type=checkbox checked>${svg(g,16)}${g}(${c})`;
 l.firstChild.onchange=e=>{e.target.checked?on.add(g):on.delete(g);render()};f.appendChild(l)});
function setAll(v){on.clear();if(v)G.forEach(g=>on.add(g[0]));f.querySelectorAll("input").forEach(c=>c.checked=v);render()}
document.getElementById("ba").onclick=()=>setAll(true);document.getElementById("bn").onclick=()=>setAll(false);
document.getElementById("fo").onchange=e=>{favOnly=e.target.checked;render()};document.getElementById("tg").onclick=()=>{document.body.classList.toggle("fo");document.getElementById("tg").textContent=document.body.classList.contains("fo")?"絞り込み ▴":"絞り込み ▾"};
document.getElementById("lh").onclick=()=>{document.body.classList.toggle("lo");render()};
document.getElementById("q").oninput=render;render();
</script></body></html>
